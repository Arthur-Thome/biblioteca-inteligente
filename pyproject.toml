[project]
name = "biblioteca-inteligente"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask>=3.0,<4",
    "Pillow>=10,<13",
    "requests>=2.31,<3",
    "rapidfuzz>=3.5,<4",
    "numpy>=1.26,<3",
    "rapidocr>=3.0,<4",
    "onnxruntime>=1.18,<2",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[tool.vercel.scripts]
build = "python scripts/build_vercel.py"
